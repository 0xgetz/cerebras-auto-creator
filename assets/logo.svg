<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Cerebras Auto Creator logo">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff7a1a"/>
      <stop offset="55%" stop-color="#ff4d0f"/>
      <stop offset="100%" stop-color="#c81e00"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b2027"/>
      <stop offset="100%" stop-color="#0b0e12"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#g2)"/>
  <rect x="6" y="6" width="500" height="500" rx="108" fill="none" stroke="#2a323c" stroke-width="3"/>

  <!-- wafer ring -->
  <g transform="translate(256 250)">
    <circle r="150" fill="none" stroke="url(#g1)" stroke-width="16" stroke-dasharray="14 12" opacity="0.9" filter="url(#glow)"/>
    <circle r="108" fill="none" stroke="#ff6a1f" stroke-width="6" opacity="0.35"/>
    <!-- circuit traces -->
    <g stroke="#ff7a1a" stroke-width="7" stroke-linecap="round" opacity="0.95">
      <path d="M0 -108 V-150"/>
      <path d="M104 30 L145 55"/>
      <path d="M-104 30 L-145 55"/>
      <path d="M76 -76 L105 -105"/>
      <path d="M-76 -76 L-105 -105"/>
    </g>
    <!-- nodes -->
    <g fill="#ffb27a">
      <circle cx="0" cy="-108" r="9"/>
      <circle cx="104" cy="30" r="9"/>
      <circle cx="-104" cy="30" r="9"/>
      <circle cx="76" cy="-76" r="8"/>
      <circle cx="-76" cy="-76" r="8"/>
    </g>
    <!-- lightning bolt (auto / fast) -->
    <path d="M12 -60 L-34 6 L-2 6 L-14 64 L36 -8 L2 -8 Z" fill="#fff" filter="url(#glow)"/>
  </g>

  <!-- keyboard base -->
  <g transform="translate(256 442)">
    <rect x="-96" y="-16" width="192" height="34" rx="17" fill="#161b21" stroke="#39424e" stroke-width="3"/>
    <g fill="#ff7a1a" opacity="0.85">
      <rect x="-72" y="-6" width="20" height="12" rx="4"/>
      <rect x="-42" y="-6" width="20" height="12" rx="4"/>
      <rect x="-12" y="-6" width="20" height="12" rx="4"/>
      <rect x="18" y="-6" width="20" height="12" rx="4"/>
      <rect x="48" y="-6" width="20" height="12" rx="4"/>
    </g>
  </g>
</svg>
